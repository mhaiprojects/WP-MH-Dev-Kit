name: cursor-wpdev2
type: wordpress
docroot: ""
php_version: "8.3"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames:
    - "*.cursor-wpdev2"
additional_fqdns: []
database:
    type: mariadb
    version: "10.11"
use_dns_when_possible: true
composer_version: "2"
web_environment:
    - WP_ENVIRONMENT_TYPE=local
# Disabled 2026-11-19 at Michael's request: stop re-adding the multisite require on every start.
# hooks:
#     post-start:
#         - exec-host: bash scripts/ensure-multisite-wp-config.sh
# Added 2026-11-19: DDEV stops rewriting wp-config.php, so the multisite require stays without a start hook.
disable_settings_management: true
