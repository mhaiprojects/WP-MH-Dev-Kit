name: cursor-wpdev2
type: wordpress
docroot: ""
php_version: "8.3"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames:
    - "*.cursor-wpdev2"
additional_fqdns: []
database:
    type: mariadb
    version: "10.11"
use_dns_when_possible: true
composer_version: "2"
web_environment:
    - WP_ENVIRONMENT_TYPE=local
hooks:
    post-start:
        - exec-host: bash scripts/ensure-multisite-wp-config.sh
